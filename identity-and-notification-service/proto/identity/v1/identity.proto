syntax = "proto3";

package identity.v1;

option go_package = "github.com/nurashi/car-rental-identity/internal/api/grpc/pb;pb";

service IdentityService {
  rpc Register(RegisterRequest) returns (RegisterResponse) {}
  rpc Login(LoginRequest) returns (LoginResponse) {}
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse) {}
  rpc ResendVerification(ResendVerificationRequest) returns (ResendVerificationResponse) {}
  rpc Logout(LogoutRequest) returns (LogoutResponse) {}
  rpc GetProfile(GetProfileRequest) returns (ProfileResponse) {}
  rpc UpdateProfile(UpdateProfileRequest) returns (ProfileResponse) {}
  rpc SubmitLicense(SubmitLicenseRequest) returns (SubmitLicenseResponse) {}
  rpc ValidateLicense(ValidateLicenseRequest) returns (ValidateLicenseResponse) {}
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {}
  rpc BlockUser(BlockUserRequest) returns (BlockUserResponse) {}
  rpc SendEmailNotification(SendEmailNotificationRequest) returns (SendEmailNotificationResponse) {}
  rpc GetUserNotifications(GetUserNotificationsRequest) returns (GetUserNotificationsResponse) {}
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
  string phone = 5;
}

message RegisterResponse {
  string user_id = 1;
  string message = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  int64 expires_at = 2;
  User user = 3;
}

message VerifyEmailRequest {
  string token = 1;
}

message VerifyEmailResponse {
  string message = 1;
}

message ResendVerificationRequest {
  string email = 1;
}

message ResendVerificationResponse {
  string message = 1;
}

message LogoutRequest {
  string token = 1;
}

message LogoutResponse {
  string message = 1;
}

message GetProfileRequest {
  string user_id = 1;
}

message UpdateProfileRequest {
  string user_id = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional string phone = 4;
  optional string avatar_url = 5;
}

message ProfileResponse {
  User user = 1;
}

message SubmitLicenseRequest {
  string user_id = 1;
  string license_number = 2;
  string issuing_country = 3;
  string issue_date = 4;
  string expiry_date = 5;
  bytes front_image = 6;
  bytes back_image = 7;
}

message SubmitLicenseResponse {
  string license_id = 1;
  string status = 2;
}

message ValidateLicenseRequest {
  string user_id = 1;
}

message ValidateLicenseResponse {
  bool is_valid = 1;
  string status = 2;
  DriverLicense license = 3;
}

message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListUsersResponse {
  repeated User users = 1;
  int32 total = 2;
}

message BlockUserRequest {
  string user_id = 1;
  string reason = 2;
}

message BlockUserResponse {
  string message = 1;
}

message SendEmailNotificationRequest {
  string to = 1;
  string subject = 2;
  string body = 3;
}

message SendEmailNotificationResponse {
  bool success = 1;
  string message = 2;
}

message GetUserNotificationsRequest {
  string user_id = 1;
  int32 limit = 2;
}

message GetUserNotificationsResponse {
  repeated Notification notifications = 1;
}

message User {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string phone = 5;
  bool email_verified = 6;
  string status = 7;
  string avatar_url = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
}

message DriverLicense {
  string id = 1;
  string user_id = 2;
  string license_number = 3;
  string issuing_country = 4;
  string issue_date = 5;
  string expiry_date = 6;
  string status = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

message Notification {
  string id = 1;
  string user_id = 2;
  string type = 3;
  string subject = 4;
  string body = 5;
  int64 created_at = 6;
}
